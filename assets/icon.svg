<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="100%" stop-color="#ea0b42"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea0b42" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Squircle with Dark Slate Gradient -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" />

  <!-- Minimalist Geometric Play + Download Symbol -->
  <g filter="url(#subtleShadow)">
    <!-- Play Triangle Container -->
    <path d="M 180 130 
             C 180 118, 192 110, 203 117 
             L 378 237 
             C 390 245, 390 267, 378 275 
             L 203 395 
             C 192 402, 180 394, 180 382 
             Z" 
          fill="url(#accentGrad)"/>

    <!-- Downward Arrow (Negative Space Minimalist Cutout) -->
    <!-- Stem -->
    <rect x="236" y="195" width="40" height="90" rx="8" fill="#0f172a"/>
    <!-- Arrow Head -->
    <path d="M 210 270 
             L 302 270 
             C 310 270, 314 280, 308 286 
             L 262 332 
             C 258 336, 254 336, 250 332 
             L 204 286 
             C 198 280, 202 270, 210 270 
             Z" 
          fill="#0f172a"/>
  </g>
</svg>
