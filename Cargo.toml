[package]
name = "ap-dl"
version = "0.2.1"
edition = "2021"
authors = ["Mohammadreza A. Fard"]
description = "Fast, modern Aparat Video & Playlist Downloader built with Slint and Tokio"

[dependencies]
slint = { version = "1.9", features = ["raw-window-handle-06"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
futures-util = "0.3"
regex = "1.10"
dirs = "5.0"
open = "5.3"
arboard = "3.4"
log = "0.4"
simplelog = "0.12"
self-replace = "1.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tar = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSData", "NSArray", "NSString"] }
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSImage", "NSWindow", "NSView", "NSColor", "NSVisualEffectView", "NSMenu", "NSMenuItem"] }
window-vibrancy = "0.5"
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.9"
