name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.name }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux x86_64
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: ap-dl
            archive_ext: tar.gz
            asset_suffix: linux-x86_64

          # Windows x86_64
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: ap-dl.exe
            archive_ext: zip
            asset_suffix: windows-x86_64

          # macOS Apple Silicon (ARM64)
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            binary_name: ap-dl
            archive_ext: zip
            asset_suffix: macos-arm64

          # macOS Intel (x86_64)
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
            binary_name: ap-dl
            archive_ext: zip
            asset_suffix: macos-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Linux GUI Dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libudev-dev

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Setup macOS Signing Certificate
        if: startsWith(matrix.platform.os, 'macos') && env.MACOS_CERTIFICATE_BASE64 != ''
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import certificate into keychain
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Package Release Assets (macOS)
        if: startsWith(matrix.platform.os, 'macos')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCHIVE_NAME="ap-dl-${VERSION}-${{ matrix.platform.asset_suffix }}.zip"
          DMG_NAME="ap-dl-${VERSION}-${{ matrix.platform.asset_suffix }}.dmg"
          APP_DIR="dist/APDL.app"
          
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"
          cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }} "${APP_DIR}/Contents/MacOS/ap-dl"
          chmod +x "${APP_DIR}/Contents/MacOS/ap-dl"
          
          cp assets/AppIcon.icns "${APP_DIR}/Contents/Resources/AppIcon.icns" 2>/dev/null || cp assets/icon.icns "${APP_DIR}/Contents/Resources/AppIcon.icns" 2>/dev/null || true
          cp assets/Info.plist "${APP_DIR}/Contents/Info.plist"
          
          AUTO_IDENTITY="$(security find-identity -p codesigning -v 2>/dev/null | grep "Developer ID Application" | head -n 1 | awk -F'"' '{print $2}' || true)"
          
          if [[ -n "$AUTO_IDENTITY" ]]; then
            echo "Codesigning with identity: $AUTO_IDENTITY"
            codesign --force --deep --options runtime --entitlements assets/entitlements.plist --sign "$AUTO_IDENTITY" "${APP_DIR}"
          else
            echo "Applying ad-hoc signature..."
            codesign --force --deep --sign - "${APP_DIR}" 2>/dev/null || true
          fi
          
          # Create DMG
          mkdir -p dist/dmg_staging
          cp -R "${APP_DIR}" dist/dmg_staging/APDL.app
          ln -s /Applications dist/dmg_staging/Applications
          hdiutil create -volname "APDL" -srcfolder dist/dmg_staging -ov -format UDZO "${DMG_NAME}"
          rm -rf dist/dmg_staging

          if [[ -n "$AUTO_IDENTITY" ]]; then
            echo "Signing DMG with identity: $AUTO_IDENTITY"
            codesign --force --sign "$AUTO_IDENTITY" "${DMG_NAME}"
            
            if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
              echo "Submitting DMG to Apple Notary Service..."
              xcrun notarytool submit "${DMG_NAME}" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              echo "Stapling notarization ticket..."
              xcrun stapler staple "${DMG_NAME}"
            fi
          fi

          # Create ZIP
          cd dist && zip -r "../${ARCHIVE_NAME}" APDL.app && cd ..
          
          mkdir -p release_binaries
          cp "${DMG_NAME}" release_binaries/
          cp "${ARCHIVE_NAME}" release_binaries/
          echo "ASSET_PATH=release_binaries/*" >> $GITHUB_ENV

      - name: Package Release Assets (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        shell: bash
        run: |
          ARCHIVE_NAME="ap-dl-${{ steps.get_version.outputs.VERSION }}-${{ matrix.platform.asset_suffix }}.tar.gz"
          mkdir -p dist
          cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }} dist/
          cp README.md dist/ 2>/dev/null || true
          cp -r assets dist/ 2>/dev/null || true
          tar -czvf "${ARCHIVE_NAME}" -C dist .
          echo "ASSET_PATH=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Package Release Assets (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          $ArchiveName = "ap-dl-${{ steps.get_version.outputs.VERSION }}-${{ matrix.platform.asset_suffix }}.zip"
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }}" -Destination dist/
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination dist/ }
          if (Test-Path "assets") { Copy-Item "assets" -Recurse -Destination dist/ }
          Compress-Archive -Path dist/* -DestinationPath $ArchiveName
          echo "ASSET_PATH=$ArchiveName" >> $env:GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.asset_suffix }}
          path: ${{ env.ASSET_PATH }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: "APDL ${{ steps.get_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
