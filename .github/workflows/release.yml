name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # 1. QUALITY GATE: Lint & Test Verification
  # ============================================================================
  check-and-test:
    name: "Quality Gate (Check & Test)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Linux GUI System Packages
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-gui-deps-ubuntu24
          restore-keys: apt-gui-deps-

      - name: Install Linux GUI Dependencies
        run: |
          mkdir -p ~/apt-cache
          # Bypass slow Azure mirror with direct Ubuntu archive
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo rm -f /etc/apt/sources.list.d/azure-cli* /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft*
          sudo apt-get update -qq
          
          # Restore cached .deb files into apt archive
          sudo cp -n ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libudev-dev
            
          # Save downloaded .deb files into user-owned cache directory
          cp -n /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

      - name: Rust Dependency Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-targets: true
          cache-on-failure: true

      - name: Run Cargo Test Suite
        run: cargo test -- --nocapture

  # ============================================================================
  # 2. BUILD: macOS (Apple Silicon ARM64)
  # ============================================================================
  build-macos:
    name: "Build - macOS (Apple Silicon)"
    needs: check-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Tag Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Dependency Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-targets: true
          cache-on-failure: true

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Setup macOS Developer ID Certificate
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          
          # Create temporary runner keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import Developer ID certificate into keychain
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Package APDL.app & Create Signed DMG
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCHIVE_NAME="ap-dl-${VERSION}-macos-arm64.zip"
          DMG_NAME="ap-dl-${VERSION}-macos-arm64.dmg"
          APP_DIR="dist/APDL.app"
          
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"
          cp target/release/ap-dl "${APP_DIR}/Contents/MacOS/ap-dl"
          chmod +x "${APP_DIR}/Contents/MacOS/ap-dl"
          
          cp assets/AppIcon.icns "${APP_DIR}/Contents/Resources/AppIcon.icns" 2>/dev/null || cp assets/icon.icns "${APP_DIR}/Contents/Resources/AppIcon.icns" 2>/dev/null || true
          cp assets/Info.plist "${APP_DIR}/Contents/Info.plist"
          
          AUTO_IDENTITY="$(security find-identity -p codesigning -v 2>/dev/null | grep "Developer ID Application" | head -n 1 | awk -F'"' '{print $2}' || true)"
          
          if [[ -n "$AUTO_IDENTITY" ]]; then
            echo "Codesigning with identity: $AUTO_IDENTITY"
            codesign --force --deep --options runtime --entitlements assets/entitlements.plist --sign "$AUTO_IDENTITY" "${APP_DIR}"
          else
            echo "Applying ad-hoc signature..."
            codesign --force --deep --sign - "${APP_DIR}" 2>/dev/null || true
          fi
          
          # Create drag-and-drop DMG installer
          mkdir -p dist/dmg_staging
          cp -R "${APP_DIR}" dist/dmg_staging/APDL.app
          ln -s /Applications dist/dmg_staging/Applications
          hdiutil create -volname "APDL" -srcfolder dist/dmg_staging -ov -format UDZO "${DMG_NAME}"
          rm -rf dist/dmg_staging

          if [[ -n "$AUTO_IDENTITY" ]]; then
            echo "Signing DMG with identity: $AUTO_IDENTITY"
            codesign --force --sign "$AUTO_IDENTITY" "${DMG_NAME}"
            
            if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
              echo "Submitting DMG to Apple Notary Service..."
              xcrun notarytool submit "${DMG_NAME}" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              echo "Stapling notarization ticket..."
              xcrun stapler staple "${DMG_NAME}"
            fi
          fi

          # Create standalone ZIP
          cd dist && zip -r "../${ARCHIVE_NAME}" APDL.app && cd ..
          
          mkdir -p macos_artifacts
          cp "${DMG_NAME}" macos_artifacts/
          cp "${ARCHIVE_NAME}" macos_artifacts/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: macos_artifacts/*

  # ============================================================================
  # 3. BUILD: Windows (x64)
  # ============================================================================
  build-windows:
    name: "Build - Windows (x64)"
    needs: check-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Tag Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Dependency Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-targets: true
          cache-on-failure: true

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Package Windows ZIP Archive
        shell: pwsh
        run: |
          $Version = "${{ steps.get_version.outputs.VERSION }}"
          $ArchiveName = "ap-dl-$Version-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path dist_win
          Copy-Item "target/release/ap-dl.exe" -Destination dist_win/
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination dist_win/ }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination dist_win/ }
          if (Test-Path "assets") { Copy-Item "assets" -Recurse -Destination dist_win/ }
          Compress-Archive -Path dist_win/* -DestinationPath $ArchiveName
          New-Item -ItemType Directory -Force -Path win_artifacts
          Move-Item $ArchiveName -Destination win_artifacts/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: win_artifacts/*

  # ============================================================================
  # 4. BUILD: Linux (x64)
  # ============================================================================
  build-linux:
    name: "Build - Linux (x64)"
    needs: check-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Tag Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Linux GUI System Packages
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-gui-deps-ubuntu24
          restore-keys: apt-gui-deps-

      - name: Install Linux GUI Dependencies
        run: |
          mkdir -p ~/apt-cache
          # Bypass slow Azure mirror with direct Ubuntu archive
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo rm -f /etc/apt/sources.list.d/azure-cli* /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft*
          sudo apt-get update -qq
          
          # Restore cached .deb files into apt archive
          sudo cp -n ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libudev-dev
            
          # Save downloaded .deb files into user-owned cache directory
          cp -n /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

      - name: Rust Dependency Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-targets: true
          cache-on-failure: true

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Package Linux Tarball Archive
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCHIVE_NAME="ap-dl-${VERSION}-linux-x64.tar.gz"
          mkdir -p dist_linux
          cp target/release/ap-dl dist_linux/
          cp README.md dist_linux/ 2>/dev/null || true
          cp LICENSE dist_linux/ 2>/dev/null || true
          cp -r assets dist_linux/ 2>/dev/null || true
          tar -czvf "${ARCHIVE_NAME}" -C dist_linux .
          mkdir -p linux_artifacts
          cp "${ARCHIVE_NAME}" linux_artifacts/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: linux_artifacts/*

  # ============================================================================
  # 5. PUBLISH: Collect Assets, Generate Checksums & Create GitHub Release
  # ============================================================================
  publish-release:
    name: "Publish GitHub Release"
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Release Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: "APDL ${{ steps.get_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
